<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrotaCTRL — Fornecedor</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="has-nav">
<div id="loading" class="loading-screen">Carregando…</div>

<div class="shell shell--nav" id="shell" style="display:none;">
  <div class="topbar">
    <div class="topbar__brand"><div class="topbar__logo">F</div><div class="topbar__title">FrotaCTRL</div></div>
    <div class="topbar__user" id="user-avatar">--</div>
  </div>

  <div class="page" id="view-fila">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-title"><span>Meus chamados ativos</span></div>
    <div id="lista-fila" class="card-list"></div>
  </div>

  <div class="page" id="view-historico" style="display:none;">
    <div class="section-title"><span>Concluídos</span></div>
    <div id="lista-historico" class="card-list"></div>
  </div>

  <div class="page" id="view-perfil" style="display:none;">
    <div class="section-title"><span>Minha conta</span></div>
    <div class="kv-row"><span class="kv-row__k">Nome</span><span id="perfil-nome"></span></div>
    <div class="kv-row"><span class="kv-row__k">Empresa</span><span id="perfil-empresa"></span></div>
    <div class="kv-row"><span class="kv-row__k">Perfil</span><span>Fornecedor</span></div>
    <button class="btn btn--danger" style="margin-top:24px;" onclick="logout()">Sair</button>
  </div>

  <div class="bottomnav">
    <div class="sidebar-brand"><div class="topbar__logo">F</div><div class="sidebar-brand__title">FrotaCTRL</div></div>
    <button class="navitem active" data-view="fila">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 001 1h4M5 21h14a2 2 0 002-2V8l-6-6H5a2 2 0 00-2 2v15a2 2 0 002 2z"/></svg>
      Ativos
    </button>
    <button class="navitem" data-view="historico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Histórico
    </button>
    <button class="navitem" data-view="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Perfil
    </button>
  </div>
</div>

<!-- SHEET: PROGRAMAR ATENDIMENTO -->
<div class="overlay hidden" id="overlay-programar">
  <div class="sheet"><div class="sheet__handle"></div>
    <div class="sheet__header"><h3>Programar atendimento</h3><button class="close-x" data-close="overlay-programar">✕</button></div>
    <form id="form-programar">
      <input type="hidden" id="pg-id" />
      <div class="field"><label>Data/hora prevista</label><input type="datetime-local" id="pg-data" required /></div>
      <button type="submit" class="btn btn--primary" style="margin-top:20px;">Confirmar atendimento</button>
    </form>
  </div>
</div>

<!-- SHEET: DIAGNÓSTICO -->
<div class="overlay hidden" id="overlay-diagnostico">
  <div class="sheet"><div class="sheet__handle"></div>
    <div class="sheet__header"><h3>Registrar diagnóstico</h3><button class="close-x" data-close="overlay-diagnostico">✕</button></div>
    <form id="form-diagnostico">
      <input type="hidden" id="dg-id" />
      <div class="field"><label>Diagnóstico técnico</label><textarea id="dg-texto" required placeholder="O que foi encontrado"></textarea></div>
      <div class="field"><label>É um caso de mau uso?</label>
        <select id="dg-mauuso"><option value="nao">Não — manutenção contratual normal</option><option value="sim">Sim — abrir fluxo de validação de mau uso</option></select>
      </div>
      <div class="field"><label>Valor apresentado / orçamento (R$)</label><input type="text" id="dg-valor" required inputmode="numeric" placeholder="R$ 0,00" /></div>
      <div class="field"><label>OS, relatório técnico, fotos (evidências)</label><input type="file" id="dg-anexos" accept="image/*,.pdf" multiple /></div>
      <button type="submit" class="btn btn--primary" id="btn-diagnostico" style="margin-top:20px;">Enviar diagnóstico</button>
    </form>
  </div>
</div>

<!-- SHEET: LIBERAÇÃO -->
<div class="overlay hidden" id="overlay-liberar">
  <div class="sheet"><div class="sheet__handle"></div>
    <div class="sheet__header"><h3>Liberar máquina</h3><button class="close-x" data-close="overlay-liberar">✕</button></div>
    <form id="form-liberar">
      <input type="hidden" id="lb-id" />
      <div class="field"><label>Serviço executado / peças substituídas</label><textarea id="lb-servico" required></textarea></div>
      <div class="field"><label>Operacional ou com restrição após liberação?</label>
        <select id="lb-status-final"><option value="operacional">Operacional</option><option value="operacional_restricao">Operacional com restrição</option></select>
      </div>
      <button type="submit" class="btn btn--primary" style="margin-top:20px;">Confirmar liberação</button>
    </form>
  </div>
</div>

<!-- SHEET: FATURAMENTO -->
<div class="overlay hidden" id="overlay-faturar">
  <div class="sheet"><div class="sheet__handle"></div>
    <div class="sheet__header"><h3>Faturamento</h3><button class="close-x" data-close="overlay-faturar">✕</button></div>
    <form id="form-faturar">
      <input type="hidden" id="ft-id" />
      <div class="field"><label>Tipo de manutenção</label>
        <select id="ft-tipo"><option value="preventiva">Preventiva</option><option value="corretiva">Corretiva</option><option value="mau_uso">Mau uso</option><option value="desgaste">Desgaste padrão</option></select>
      </div>
      <div class="field"><label>Valor faturado (R$)</label><input type="text" id="ft-valor" required inputmode="numeric" placeholder="R$ 0,00" /></div>
      <div class="field"><label>Nota fiscal</label><input type="file" id="ft-nf" accept=".pdf,image/*" /></div>
      <button type="submit" class="btn btn--primary" id="btn-faturar" style="margin-top:20px;">Concluir chamado</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="fornecedor.js"></script>
</body>
</html>
