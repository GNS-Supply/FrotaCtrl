<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101922" />
<title>FrotaCTRL — Sem conexão</title>
<style>
  html,body{margin:0;height:100%;background:#101922;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
  .logo{width:72px;height:72px;border-radius:18px;background:#E8A33D;color:#2B1C04;display:grid;place-items:center;font:700 40px Oswald,"Arial Narrow",sans-serif;margin-bottom:24px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 28px;color:rgba(255,255,255,.7);max-width:320px;line-height:1.5;font-size:15px}
  button{background:#E8A33D;color:#2B1C04;border:0;border-radius:12px;padding:14px 28px;font:700 15px Inter,system-ui,sans-serif;min-height:48px}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <div class="logo">F</div>
  <h1>Sem conexão</h1>
  <p>Não foi possível carregar o FrotaCTRL agora. Verifique sua internet e tente de novo.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
