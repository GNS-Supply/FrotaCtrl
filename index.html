<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrotaCTRL — Entrar</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">
  <div class="auth-wrap">
    <div class="auth-logo">F</div>
    <h1 class="auth-title">FrotaCTRL</h1>
    <p class="auth-sub">Plataforma de gestão de frota — chamados, manutenção, mau uso, custos e recorrência.</p>

    <div class="auth-toggle">
      <button type="button" id="btn-tab-login" class="active">Entrar</button>
      <button type="button" id="btn-tab-cadastro">Criar conta</button>
    </div>

    <form id="form-login">
      <div class="field"><label>E-mail</label><input type="email" id="login-email" required autocomplete="email" /></div>
      <div class="field"><label>Senha</label><input type="password" id="login-senha" required autocomplete="current-password" /></div>
      <button type="submit" class="btn btn--primary" style="margin-top:22px;">Entrar</button>
    </form>

    <form id="form-cadastro" style="display:none;">
      <div class="field">
        <label>Perfil</label>
        <select id="cad-tipo" required>
          <option value="solicitante">Solicitante — abre chamados</option>
          <option value="gestao_frota">Gestão de Frota — triagem, aciona, autoriza, libera</option>
          <option value="fornecedor">Fornecedor — executa a manutenção</option>
          <option value="manutencao">Manutenção Magius — valida mau uso</option>
          <option value="aprovador">Aprovador — aprova valores</option>
          <option value="administrador">Administrador — cadastros e parâmetros</option>
        </select>
      </div>
      <div class="field"><label>Nome completo</label><input type="text" id="cad-nome" required /></div>
      <div class="field"><label>Empresa</label><input type="text" id="cad-empresa" /></div>
      <div class="field"><label>Telefone</label><input type="tel" id="cad-telefone" placeholder="(00) 00000-0000" /></div>
      <div class="field"><label>E-mail</label><input type="email" id="cad-email" required autocomplete="email" /></div>
      <div class="field"><label>Senha</label><input type="password" id="cad-senha" required minlength="6" autocomplete="new-password" /></div>
      <button type="submit" class="btn btn--primary" style="margin-top:22px;">Criar conta</button>
    </form>

    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
