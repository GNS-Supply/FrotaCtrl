<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FrotaCTRL — Chamado</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="loading" class="loading-screen">Carregando…</div>

<div class="shell" id="shell" style="display:none;">
  <div class="topbar">
    <button class="btn btn--ghost btn--sm" onclick="voltar()" style="width:auto;">← Voltar</button>
    <div class="topbar__user" id="user-avatar">--</div>
  </div>

  <div class="page">
    <div class="machine-plate" id="cabecalho"></div>

    <div class="stats-grid" id="tempos-grid" style="margin-top:4px;"></div>

    <div class="section-title"><span>Classificação</span></div>
    <div class="kv-row"><span class="kv-row__k">Categoria</span><span id="c-categoria"></span></div>
    <div class="kv-row"><span class="kv-row__k">Turno</span><span id="c-turno"></span></div>
    <div class="kv-row"><span class="kv-row__k">Fluxo</span><span id="c-fluxo"></span></div>

    <div class="section-title"><span>Ocorrência</span></div>
    <p style="font-size:14px; line-height:1.5; color:var(--text-dim);" id="c-descricao"></p>
    <div class="callout" id="c-impacto-wrap" style="display:none;"><strong>Impacto e segurança:</strong> <span id="c-impacto"></span></div>
    <div class="photo-grid" id="fotos-grid"></div>

    <div id="bloco-diagnostico" style="display:none;">
      <div class="section-title"><span>Diagnóstico do fornecedor</span></div>
      <p style="font-size:14px; color:var(--text-dim);" id="dg-texto"></p>
      <div class="photo-grid" id="fotos-diagnostico"></div>
    </div>

    <div id="bloco-parecer" style="display:none;">
      <div class="section-title"><span>Parecer — Manutenção Magius</span></div>
      <div class="callout" id="parecer-callout"></div>
    </div>

    <div id="bloco-aprovacao" style="display:none;">
      <div class="section-title"><span>Aprovação</span></div>
      <div class="callout" id="aprovacao-callout"></div>
    </div>

    <div class="section-title"><span>Financeiro</span></div>
    <div class="kv-row"><span class="kv-row__k">Apresentado</span><span id="f-apresentado"></span></div>
    <div class="kv-row"><span class="kv-row__k">Validado</span><span id="f-validado"></span></div>
    <div class="kv-row"><span class="kv-row__k">Aprovado / comprometido</span><span id="f-aprovado"></span></div>
    <div class="kv-row"><span class="kv-row__k">Custo evitado</span><span id="f-evitado"></span></div>
    <div class="kv-row"><span class="kv-row__k">Faturado</span><span id="f-faturado"></span></div>
    <div class="kv-row"><span class="kv-row__k">Tipo de manutenção</span><span id="f-tipo"></span></div>
    <a id="f-nf-link" href="#" target="_blank" class="btn btn--secondary" style="margin-top:12px; display:none;">Ver nota fiscal</a>

    <div class="section-title"><span>Linha do tempo</span></div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="chamado.js"></script>
</body>
</html>
