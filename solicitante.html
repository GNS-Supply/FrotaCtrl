<title>FrotaCTRL — Solicitante</title>

<body class="has-nav">
<div id="loading" class="loading-screen">Carregando…</div>

<div class="shell shell--nav" id="shell" style="display:none;">
  <div class="topbar">
    <div class="topbar__brand"><div class="topbar__logo">F</div><div class="topbar__title">FrotaCTRL</div></div>
    <div class="topbar__user" id="user-avatar">--</div>
  </div>

  <div class="page" id="view-meus">
    <div class="page-header"><h1>Meus chamados</h1><p>Abra chamados de manutenção e acompanhe o andamento de cada um.</p></div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-title"><span>Meus chamados</span></div>
    <div class="pill-group" id="filtro-status-solicitante"></div>
    <div id="lista-chamados" class="card-list"></div>
  </div>

  <div class="page" id="view-perfil" style="display:none;">
    <div class="section-title"><span>Minha conta</span></div>
    <div class="kv-row"><span class="kv-row__k">Nome</span><span id="perfil-nome"></span></div>
    <div class="kv-row"><span class="kv-row__k">Empresa</span><span id="perfil-empresa"></span></div>
    <div class="kv-row"><span class="kv-row__k">E-mail</span><span id="perfil-email"></span></div>
    <div class="kv-row"><span class="kv-row__k">Perfil</span><span>Solicitante</span></div>
    <button class="btn btn--danger" style="margin-top:24px;" onclick="logout()">Sair</button>
  </div>

  <div class="spacer-fab" id="fab-wrap"><button class="fab" id="btn-fab-chamado">+</button></div>

  <div class="bottomnav">
    <div class="sidebar-brand"><div class="topbar__logo">F</div><div class="sidebar-brand__title">FrotaCTRL</div></div>
    <button class="navitem active" data-view="meus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 14l2 2 4-4"/></svg>
      Chamados
    </button>
    <button class="navitem" data-view="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Perfil
    </button>
  </div>
</div>
